[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpo"
version = "0.1.0"
description = "Forecasted Portfolio Optimisation: monthly ML stock selection for US + Swedish equities with walk-forward backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.18"]
dev = ["pytest>=7"]

[project.scripts]
fpo = "fpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
